name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 重新打包 Python 引擎
        run: python tools/build_web_bundle.py
      - name: 注入版本号（Service Worker 缓存失效）
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/pace-shell-v[0-9a-f]*/pace-shell-${SHA}/" web/sw.js
          grep -o "pace-shell-[0-9a-f]*" web/sw.js | head -1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
